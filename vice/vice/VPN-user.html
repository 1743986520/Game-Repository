<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統維護中</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .maintenance-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .maintenance-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .back-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .countdown {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        .countdown-text {
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">🔧</div>
        <h1>系統維護中</h1>
        <p>親愛的用戶，目前系統正在進行維護與更新作業，以提供您更優質的服務品質。</p>
        <p>預計維護時間：10天</p>
        
        <div class="countdown">
            <div class="countdown-text" id="countdown">系統將在 <span id="timer">10</span> 天後恢復</div>
        </div>
        
        <a href="../../index.html" class="back-button">返回首頁</a>
    </div>

    <script>
        // 倒數計時功能
        let minutes = 30;
        const timerElement = document.getElementById('timer');
        
        function updateCountdown() {
            minutes--;
            timerElement.textContent = minutes;
            
            if (minutes <= 0) {
                timerElement.textContent = '0';
                clearInterval(countdownInterval);
                // 可以加入自動重新導向的程式碼
                // window.location.href = "../../index.html";
            }
        }
        
        // 每分鐘更新一次
        const countdownInterval = setInterval(updateCountdown, 60000);
        
        // 檢查返回按鈕的連結路徑
        console.log('返回按鈕將導向:', '../../index.html');
    </script>
</body>
</html>
