<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海外云電腦</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-offline { border-color: #6c757d; background-color: #f8f9fa; }
    .card-online { border-color: #28a745; background-color: #e6f4ea; }
    .card-occupied { border-color: #dc3545; background-color: #f8d7da; }
    .connection-details { display: none; padding: 10px; background-color: #f1f1f1; border-radius: 5px; margin-top: 10px; }
    .copy-btn { margin-left: 10px; }
  </style>
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-3">海外云電腦</h1>
    <p class="text-center text-muted mb-4">本項目目前處於測試階段，請謹慎使用，且勿留下個人資料於云電腦，應為沒有很好的設備，所以會很卡，且資源很有限請勿長期占用<br>電腦配置為<br>CPU:i5-12400(虛擬化且分配2核心)<br>RAM:6144MB（6GB)<br>網路:4G網路(很差)<br>如果有好心人能幫忙提供個伺服器或雲電腦的話萬分感謝</p>
    <div class="text-center mb-4">
      <a href="https://www.workslink.com/zh/download/" class="btn btn-primary me-2">遠控軟件安裝</a>
      <a href="https://1743986520.github.io/Game-Repository/" class="btn btn-secondary">返回</a>
    </div>
    <div id="pc-list" class="row"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 請根據你的實際路徑修改這個 URL
    const TXT_URL = 'https://raw.githubusercontent.com/1743986520/Game-Repository/main/Library/computers.txt';

    // 解析 computers.txt
    function parseComputers(data) {
      const pcs = [];
      const lines = data.trim().split('\n');
      
      console.log('原始數據:', lines); // 除錯用
      
      for (let i = 0; i < lines.length; i += 4) {
        if (i + 3 < lines.length) {
          const name = lines[i].trim();
          const idLine = lines[i + 1].trim();
          const authLine = lines[i + 2].trim();
          const statusLine = lines[i + 3].trim();
          
          // 正確解析每一行
          const id = idLine.replace('ID:', '').trim();
          const authCode = authLine.replace('授權碼:', '').trim();
          const status = statusLine.replace('狀態:', '').trim();
          
          console.log(`解析電腦 ${name}:`, {id, authCode, status}); // 除錯用
          
          pcs.push({ name, id, authCode, status });
        }
      }
      return pcs;
    }

    // 顯示 PC 列表
    function displayPCs(pcs) {
      const pcList = document.getElementById('pc-list');
      pcList.innerHTML = '';
      
      if (pcs.length === 0) {
        pcList.innerHTML = '<p class="text-center text-warning">沒有找到可用的雲電腦</p>';
        return;
      }
      
      pcs.forEach(pc => {
        // 正確判斷狀態
        let statusText, cardClass, clickable;
        
        console.log(`電腦 ${pc.name} 的狀態碼: "${pc.status}"`); // 除錯用
        
        if (pc.status === '1') {
          statusText = '離線';
          cardClass = 'card-offline';
          clickable = 'default';
        } else if (pc.status === '2') {
          statusText = '空閒';
          cardClass = 'card-online';
          clickable = 'pointer';
        } else if (pc.status === '3') {
          statusText = '已被佔用';
          cardClass = 'card-occupied';
          clickable = 'default';
        } else {
          statusText = `未知狀態 (${pc.status})`;
          cardClass = 'card-offline';
          clickable = 'default';
        }

        const pcCard = `
          <div class="col-md-4 mb-3">
            <div class="card ${cardClass}" style="cursor: ${clickable};">
              <div class="card-body">
                <h5 class="card-title">${pc.name}</h5>
                <p class="card-text">狀態：${statusText}</p>
                <div class="connection-details" id="details-${pc.name}">
                  <p>ID: ${pc.id} <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyText('${pc.id}')">複製</button></p>
                  <p>授權碼: ${pc.authCode} <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyText('${pc.authCode}')">複製</button></p>
                </div>
              </div>
            </div>
          </div>
        `;
        pcList.insertAdjacentHTML('beforeend', pcCard);

        // 點擊事件
        const cardElement = document.querySelector(`#details-${pc.name}`).parentElement;
        
        if (pc.status === '2') {
          // 只有空閒的電腦可以點擊顯示詳細資訊
          cardElement.addEventListener('click', (e) => {
            // 防止複製按鈕的點擊觸發卡片點擊
            if (e.target.classList.contains('copy-btn')) return;
            
            const details = document.querySelector(`#details-${pc.name}`);
            details.style.display = details.style.display === 'block' ? 'none' : 'block';
          });
        } else {
          // 離線或被佔用的電腦點擊時顯示提示
          cardElement.addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-btn')) return;
            
            if (pc.status === '1') {
              alert('電腦離線，無法連接！');
            } else if (pc.status === '3') {
              alert('電腦已被佔用！');
            } else {
              alert(`電腦目前無法使用！狀態: ${pc.status}`);
            }
          });
        }
      });
    }

    // 複製到剪貼簿
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('已複製到剪貼簿！');
      }).catch(() => {
        // 降級方案
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert('已複製到剪貼簿！');
      });
    }

    // 載入並刷新數據
    function loadComputers() {
      fetch(TXT_URL)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then(data => {
          console.log('獲取到的數據:', data); // 除錯用
          const pcs = parseComputers(data);
          console.log('解析後的電腦列表:', pcs); // 除錯用
          displayPCs(pcs);
        })
        .catch(error => {
          console.error('Error fetching computers.txt:', error);
          document.getElementById('pc-list').innerHTML = '<p class="text-center text-danger">無法載入雲電腦列表，請檢查 computers.txt 路徑！</p>';
        });
    }

    // 初始載入
    loadComputers();
    // 每 60 秒刷新
    setInterval(loadComputers, 60000);
  </script>
</body>
</html>
